name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pixpassport-uk-production
  cancel-in-progress: false # never kill a deploy mid-build; queue instead

permissions:
  contents: read

jobs:
  verify:
    name: Lint & build check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -e
            cd ~/apps/pixpassport.uk
            git fetch --prune origin
            # Run the deploy script from the commit being deployed
            git show origin/main:scripts/deploy.sh > /tmp/pixpassport-uk-deploy.sh
            bash /tmp/pixpassport-uk-deploy.sh
